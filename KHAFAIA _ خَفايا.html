<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KHAFAIA | خَفايا</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#163D32;--sand:#E9DFC9;--palm:#829477;--ivory:#F8F6F0;--charcoal:#202822;--copper:#B77745;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ivory);color:var(--charcoal);font:400 16px/1.7 "IBM Plex Sans Arabic",Inter,system-ui,sans-serif}
[lang=en] body{font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.55}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--forest);color:var(--ivory);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:700;font-size:20px;padding:4px 10px 14px;border-bottom:3px solid var(--copper);margin-bottom:8px}
aside h3{font-size:13px;font-weight:500;color:var(--sand);margin:14px 10px 2px}
aside a{display:block;color:var(--ivory);text-decoration:none;padding:9px 12px;border-radius:8px;border-inline-start:3px solid transparent}
aside a:hover{background:rgba(248,246,240,.1)}
aside a[aria-current=page]{background:rgba(248,246,240,.16);border-inline-start-color:var(--copper);font-weight:700}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
aside a:focus-visible{outline-color:var(--sand)}
main{padding:28px clamp(16px,4vw,44px);max-width:1100px;width:100%}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:28px;line-height:1.3;margin:0;color:var(--forest)}
h2{font-size:19px;margin:0 0 8px;color:var(--forest)}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button,select,input{font:inherit}
.btn{background:var(--forest);color:var(--ivory);border:2px solid var(--forest);border-radius:10px;padding:8px 16px;cursor:pointer;min-height:44px}
.btn:hover{background:#0f2e25}
.btn.alt{background:var(--ivory);color:var(--forest)}
.btn.alt:hover{background:var(--sand)}
.btn[aria-pressed=true]{background:var(--sand);color:var(--forest)}
.demo{background:var(--sand);color:var(--forest);border-inline-start:6px solid var(--copper);padding:10px 14px;border-radius:8px;margin-bottom:18px;font-weight:500}
.card{background:#fff;border:1px solid rgba(130,148,119,.55);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(22,61,50,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.stat b{display:block;font-size:30px;color:var(--forest);line-height:1.2}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;background:#fff;border:1px solid rgba(130,148,119,.55);border-radius:14px;padding:16px}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--forest);color:var(--ivory);font-weight:700;margin-bottom:6px}
.steps a{color:var(--forest);font-weight:700}
label{display:block;font-weight:500;margin:12px 0 4px;color:var(--forest)}
input,select{width:100%;max-width:420px;padding:9px 12px;border:1.5px solid var(--palm);border-radius:8px;background:#fff;color:var(--charcoal);min-height:44px}
input:disabled{background:var(--ivory);opacity:.6}
.ck{display:flex;gap:8px;align-items:center}
input[type=checkbox]{width:22px;height:22px;min-height:22px;accent-color:var(--forest)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.fg input,.fg select{max-width:100%}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid rgba(130,148,119,.45)}
th{background:var(--sand);color:var(--forest)}
.tag{display:inline-block;background:var(--sand);color:var(--forest);padding:2px 10px;border-radius:99px;font-weight:500}
.res{border-inline-start:6px solid var(--copper);margin-top:16px}
.dir{display:inline-block}[dir=rtl] .dir{transform:scaleX(-1)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--sand);border-radius:12px;padding:14px;color:var(--forest)}
.tile b{font-size:22px;display:block}
.hero{background:var(--forest);color:var(--ivory);border-radius:16px;padding:22px;margin-bottom:18px}
.hero p{margin:6px 0}.tg{color:var(--sand);font-weight:700;font-size:18px}
.ico{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ico div{background:rgba(248,246,240,.12);border-radius:12px;padding:10px;text-align:center;min-width:92px;font-size:13px}
.ico svg{width:44px;height:44px;stroke:var(--sand);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 4px}
.menu{display:none}
.note{color:var(--charcoal);font-size:14px}
@media(max-width:768px){.app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;align-items:center}aside nav{display:none;width:100%}aside.open nav{display:block}.menu{display:inline-block;margin-inline-start:auto}.brand{border:0;padding:0;margin:0}}
@media(prefers-reduced-motion:no-preference){.card,.steps li{transition:box-shadow .15s}.card:hover{box-shadow:0 4px 12px rgba(22,61,50,.14)}}
</style></head>

function matches(){const r=rows(),o=[];r.filter(x=>x.t==="sup").forEach(s=>r.filter(x=>x.t==="dem").forEach(d=>{
const why=[];if(s.c===d.c)why.push(t("rc"));else if(s.c==="mx"||d.c==="mx")why.push(t("rm"));else if(GRP[s.c]&&GRP[s.c]===GRP[d.c])why.push(t("rr"));if(!why.length)return;

const V={
ov(){const r=rows(),st=[[t("s1"),r.length],[t("s2"),matches().length],[t("s3"),new Set(r.map(x=>x.c)).size],[t("s4"),new Set(r.map(x=>x.r)).size]];

<div class="grid">${st.map(s=>`<div class="card stat"><b><bdi>${num(s[1])}</bdi></b><span>${s[0]}</span></div>`).join("")}</div>
<h2>${t("cats")}</h2><p class="bar">${Object.keys(CAT).map(k=>`<span class="tag">${l(CAT[k])}</span>`).join("")}</p>
<h2>${t("wf")}</h2><ol class="steps">${[["w1","an"],["w2","mk"],["w3","fe"],["w4","ad"]].map(w=>`<li><p>${t(w[0])}</p><a href="#${w[1]}">${t("open")} <span class="dir">›</span></a></li>`).join("")}</ol>`},
an(){const a=S.an,F=(id,lb,c)=>`<div><label for="${id}">${t(lb)}</label>${c}</div>`;
if(a.done){const tq=(parseFloat(a.q)||0)*(a.u==="kg"?.001:1),n=[];if(a.form==="fresh"||a.mo==="high")n.push("n_wet");if(a.form==="mixed"||a.cat==="mx")n.push("n_mix");if(a.form==="processed")n.push("n_proc");n.push(a.sp.trim()?"n_sp":"n_nosp");if(a.eq==="none")n.push("n_eq");if(a.sc==="pilot")n.push("n_pil");if(a.sc==="comm")n.push("n_com");if(tq&&tq<2)n.push("n_small");
return `<div class="card"><h2>${t("dirs")}: ${l(CAT[a.cat])}</h2><p class="note">${a.sp.trim()?esc(a.sp)+" · ":""}<bdi>${num(parseFloat(a.q)||0)}</bdi> ${l(O.u[a.u])} · ${l(RG[a.r])} · ${l(O.form[a.form])} · ${l(O.dis[a.dis])}</p><p class="demo">${t("ruleNote")}</p>
<ul>${RULE[a.cat].map(i=>`<li><b>${l(IDEA[i])}</b><br><span class="note">${t("chk")}: ${l(NEED[i])}</span></li>`).join("")}</ul><h2>${t("notes")}</h2><ul>${n.map(k=>`<li>${t(k)}</li>`).join("")}</ul><button class="btn alt" data-a="reset">${t("again")}</button></div>`}
const f=S.step===1?F("a1","fCat",`<select id="a1" data-an="cat">${opts(CAT,a.cat)}</select>`)+F("a2","fSp",`<input id="a2" data-an="sp" list="spl" dir="auto" value="${esc(a.sp)}"><datalist id="spl"><option value="${SP.date[S.lang==="ar"?1:0]}"><option value="${SP.coco[S.lang==="ar"?1:0]}"></datalist>`)+F("a3","fForm",`<select id="a3" data-an="form">${opts(O.form,a.form)}</select>`)+F("a4","fMo",`<select id="a4" data-an="mo">${opts(O.mo,a.mo)}</select>`)
:S.step===2?F("a5","fQ",`<input id="a5" data-an="q" type="number" min="0" step="any" dir="ltr" value="${esc(a.q)}">`)+F("a6","fU",`<select id="a6" data-an="u">${opts(O.u,a.u)}</select>`)+F("a7","fR",`<select id="a7" data-an="r">${opts(RG,a.r)}</select>`)
:F("a8","fDis",`<select id="a8" data-an="dis">${opts(O.dis,a.dis)}</select>`)+F("a9","fEq",`<select id="a9" data-an="eq">${opts(O.eq,a.eq)}</select>`)+F("a10","fSc",`<select id="a10" data-an="sc">${opts(O.sc,a.sc)}</select>`);
return `<p>${t("anS")}</p><div class="card"><p class="note">${t("stepOf").replace("{a}",S.step)} · ${t("st"+S.step)}</p><div class="fg">${f}</div><p class="bar" style="margin-top:16px">${S.step>1?`<button class="btn alt" data-a="back"><span class="dir">‹</span> ${t("back")}</button>`:""}<button class="btn" data-a="next">${S.step<3?t("next"):t("done")} ${S.step<3?'<span class="dir">›</span>':""}</button></p></div>`},
mk(){const r=rows().filter(x=>(S.filter==="all"||x.t===S.filter)&&(S.fcat==="all"||x.c===S.fcat)),m=matches();
return `<p>${t("mkS")}</p><div class="bar" role="group">${["all","sup","dem"].map(f=>`<button class="btn alt" data-f="${f}" aria-pressed="${S.filter===f}">${t(f)}</button>`).join("")}<select id="fc" data-fc aria-label="${t("item")}" style="width:auto"><option value="all">${t("allc")}</option>${opts(CAT,S.fcat)}</select></div>
<div class="card tw" style="margin-top:14px">${r.length?`<table><thead><tr>${["type","item","spc","qty","region","mo","av","pr","ap","vs"].map(k=>`<th>${t(k)}</th>`).join("")}</tr></thead><tbody>${r.map(x=>`<tr><td><span class="tag">${x.id} · ${t(x.t)}</span></td><td>${l(CAT[x.c])}</td><td>${spn(x)}</td><td><bdi>${num(x.q)} ${l(O.u[x.u])}</bdi></td><td>${l(RG[x.r])}</td><td>${l(O.mo[x.mo])}</td><td>${l(O.av[x.av])}</td><td>${l(O.pr[x.pr])}</td><td>${l(IDEA[x.ap])}</td><td>${t("vst")}</td></tr>`).join("")}</tbody></table>`:`<p>${t("banner")}</p>`}</div>
<h2 style="margin-top:20px">${t("mt")}</h2>${m.length?m.map(x=>`<div class="card" style="margin-bottom:10px"><b><bdi>${x.s.id}</bdi> ${l(CAT[x.s.c])} <span class="dir">›</span> <bdi>${x.d.id}</bdi> ${l(CAT[x.d.c])}</b><ul>${x.why.map(w=>`<li>${w}</li>`).join("")}</ul><p class="note">${t("mnote")}</p></div>`).join(""):`<p>${t("nomt")}</p>`}`},
fe(){const f=S.fe,inp=(k,id,lb,v)=>`<div><label for="${id}">${lb}</label><input id="${id}" data-fe="${k}" type="number" min="0" step="any" dir="ltr" value="${v}"></div>`;

<h2 style="margin-top:16px">${t("fixed")}</h2><div class="fg">${inp("eqp","fe1",t("eqp"),f.eqp)}${inp("lab","fe2",t("lab"),f.lab)}${inp("oth","fe3",t("oth"),f.oth)}</div></div><div class="card res" id="res" aria-live="polite">${feRes()}</div>`},
mp(){const r=rows();return `<p>${t("mpS")}</p><div class="map">${Object.keys(RG).map(k=>{const c=r.filter(x=>x.r===k).length;return `<div class="tile"><b><bdi>${num(c)}</bdi></b>${l(RG[k])}<br><span class="note">${t("lst")}</span></div>`}).join("")}</div>`},

bm(){return `<p>${t("bmS")}</p><div class="grid">${[1,2,3].map(i=>`<div class="card"><h2>${t("b"+i)}</h2><p>${t("b"+i+"t")}</p></div>`).join("")}</div>`},
au(){const su=S.auth==="su";return `<div class="card" style="max-width:480px"><div class="bar" role="group"><button class="btn alt" data-au="li" aria-pressed="${!su}">${t("li")}</button><button class="btn alt" data-au="su" aria-pressed="${su}">${t("su")}</button></div>

function feRes(){const f=S.fe,vc=Object.keys(f.c).reduce((a,k)=>a+(f.on[k]?f.c[k]:0),0),out=f.q*f.y/100,rev=out*f.p,cost=f.q*vc+f.eqp+f.lab+f.oth,net=rev-cost;
return `<h2>${t("net")}: <bdi>${omr(net)}</bdi></h2><p>${t("outT")}: <bdi>${num(out)} ${t("tn")}</bdi><br>${t("rev")}: <bdi>${omr(rev)}</bdi><br>${t("cost")}: <bdi>${omr(cost)}</bdi><br>${t("yr")}: <bdi>${omr(net*12)}</bdi><br>${t("mg")}: <bdi>${(rev?net/rev*100:0).toFixed(1)}%</bdi><br>${t("be")}: <bdi>${out?omr(cost/out):"—"}</bdi></p><p class="note">${t("formula")}</p>`}
function render(){const L=S.lang;document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";

const NAV=[["g1",["ov","an","mk"]],["g2",["fe","mp","ad"]],["g3",["bm","au"]]];

function go(){const h=location.hash.slice(1);S.page=V[h]?h:"ov";S.menu=false;render()}

document.addEventListener("click",e=>{const b=e.target.closest("[data-a],[data-f],[data-ad],[data-au]");if(!b)return;const d=b.dataset;sv();

document.addEventListener("input",e=>{const el=e.target,d=el.dataset,k=d.fe;
